name: יצירת קריינות (Edge TTS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/monopoly-hebrew-dhr54d
      - claude/monopoly-financial-education-scrm25
    paths:
      - 'tools/voice_lines.json'
      - 'tools/generate_voice.py'

permissions:
  contents: write

concurrency:
  group: voice
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: התקנת edge-tts ו-ffmpeg
        run: |
          pip install edge-tts
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: יצירת קובצי הקריינות (מאפס)
        run: |
          rm -rf audio
          python tools/generate_voice.py

      - name: Commit קובצי האודיו
        run: |
          git config user.name "voice-bot"
          git config user.email "actions@github.com"
          git add audio/
          if git diff --cached --quiet; then
            echo "אין שינויים באודיו"
          else
            git commit -m "קובצי קריינות מ-Edge TTS (he-IL-HilaNeural)"
            git push
          fi
