name: פרסום לאתר (GitHub Pages)

on:
  push:
    branches:
      - main
      - claude/monopoly-hebrew-dhr54d
      - claude/monopoly-financial-education-scrm25
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: הרצת בדיקות המנוע (ראשי + גרסת נסיון)
        run: node --test tests/engine.test.mjs beta/tests/engine.test.mjs

      - name: פרסום לענף gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,tests,beta/tests'
          commit_message: 'פרסום אתר: ${{ github.event.head_commit.message }}'
