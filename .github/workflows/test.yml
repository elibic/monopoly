name: Payment and game regression tests
on:
  push:
    branches: [codex/monopoly-wonderland]
  pull_request:
    branches: [claude/bug-report-gameplay-a8rd1k]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false jsdom@26.1.0
      - run: node --test tests/*.test.mjs tests/dom/*.test.mjs
